# HAVOC Local Development Docker Compose
# Exactly two services: postgres and havoc-api
# NOTE: 'havoc_dev_password' is for local development only and is never used in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: havoc
      POSTGRES_USER: havoc
      POSTGRES_PASSWORD: havoc_dev_password # Local-dev credential only, used solely within this compose network
    ports:
      - "5432:5432"
    volumes:
      - havoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havoc"]
      interval: 5s
      timeout: 3s
      retries: 5

  havoc-api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://havoc:havoc_dev_password@postgres:5432/havoc?sslmode=disable"
      PORT: ":8080"
    ports:
      - "8080:8080"

volumes:
  havoc_pgdata:
